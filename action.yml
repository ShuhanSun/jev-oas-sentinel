name: JEV OAS Sentinel
description: Detect structural and semantic OpenAPI compatibility risks
author: jev-oas-sentinel contributors

inputs:
  base:
    description: Baseline OpenAPI document
    required: true
  head:
    description: Candidate OpenAPI document
    required: true
  config:
    description: Configuration file; omit to discover .jev-sentinel.yaml
    required: false
  no-config:
    description: Disable configuration discovery
    required: false
    default: "false"
  ref-root:
    description: Allowed root directory for local $ref files
    required: false
  api-key:
    description: TypeSafe API key; omit only when no-jev is true
    required: false
  no-jev:
    description: Disable semantic evaluation and run deterministic checks only
    required: false
    default: "false"
  dry-run:
    description: Plan semantic evaluations without calling JEV
    required: false
    default: "false"
  mode:
    description: advisory or enforce
    required: false
  format:
    description: json, markdown, or sarif
    required: false
    default: sarif
  output:
    description: Report output path
    required: false
    default: jev-oas-sentinel.sarif
  fail-on-review:
    description: Fail the action when review findings exist
    required: false
  max-jev-calls:
    description: Maximum number of JEV calls allowed; defaults to 20 when no config is used
    required: false
  timeout:
    description: Timeout in seconds for each JEV HTTP attempt
    required: false
  max-retries:
    description: Maximum retries after retryable JEV responses
    required: false

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # Composite actions run inside arbitrary consumer repositories, many of
        # which have no Python dependency files for setup-uv to fingerprint.
        enable-cache: false

    - name: Compare OpenAPI contracts
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.api-key }}
        SENTINEL_BASE: ${{ inputs.base }}
        SENTINEL_HEAD: ${{ inputs.head }}
        SENTINEL_CONFIG: ${{ inputs.config }}
        SENTINEL_NO_CONFIG: ${{ inputs.no-config }}
        SENTINEL_REF_ROOT: ${{ inputs.ref-root }}
        SENTINEL_NO_JEV: ${{ inputs.no-jev }}
        SENTINEL_DRY_RUN: ${{ inputs.dry-run }}
        SENTINEL_MODE: ${{ inputs.mode }}
        SENTINEL_FORMAT: ${{ inputs.format }}
        SENTINEL_OUTPUT: ${{ inputs.output }}
        SENTINEL_FAIL_ON_REVIEW: ${{ inputs.fail-on-review }}
        SENTINEL_MAX_JEV_CALLS: ${{ inputs.max-jev-calls }}
        SENTINEL_TIMEOUT: ${{ inputs.timeout }}
        SENTINEL_MAX_RETRIES: ${{ inputs.max-retries }}
      run: |
        args=(compare --base "$SENTINEL_BASE" --head "$SENTINEL_HEAD" --format "$SENTINEL_FORMAT" --output "$SENTINEL_OUTPUT")
        has_config=false
        if [[ -n "$SENTINEL_CONFIG" ]]; then
          args+=(--config "$SENTINEL_CONFIG")
          has_config=true
        elif [[ "$SENTINEL_NO_CONFIG" == "true" ]]; then
          args+=(--no-config)
        elif [[ -f .jev-sentinel.yaml ]]; then
          has_config=true
        fi
        if [[ -n "$SENTINEL_REF_ROOT" ]]; then
          args+=(--ref-root "$SENTINEL_REF_ROOT")
        fi
        if [[ -n "$SENTINEL_MODE" ]]; then
          args+=(--mode "$SENTINEL_MODE")
        fi
        if [[ "$SENTINEL_NO_JEV" == "true" ]]; then
          args+=(--no-jev)
        fi
        if [[ "$SENTINEL_DRY_RUN" == "true" ]]; then
          args+=(--dry-run)
        fi
        if [[ "$SENTINEL_FAIL_ON_REVIEW" == "true" ]]; then
          args+=(--fail-on-review)
        elif [[ "$SENTINEL_FAIL_ON_REVIEW" == "false" ]]; then
          args+=(--no-fail-on-review)
        fi
        if [[ -n "$SENTINEL_MAX_JEV_CALLS" ]]; then
          args+=(--max-jev-calls "$SENTINEL_MAX_JEV_CALLS")
        elif [[ "$has_config" == "false" ]]; then
          args+=(--max-jev-calls 20)
        fi
        if [[ -n "$SENTINEL_TIMEOUT" ]]; then
          args+=(--timeout "$SENTINEL_TIMEOUT")
        fi
        if [[ -n "$SENTINEL_MAX_RETRIES" ]]; then
          args+=(--max-retries "$SENTINEL_MAX_RETRIES")
        fi
        uv run --project "$GITHUB_ACTION_PATH" --locked python -m jev_oas_sentinel "${args[@]}"

branding:
  icon: shield
  color: purple
