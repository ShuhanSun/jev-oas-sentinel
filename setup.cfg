[metadata]
name = jev-oas-sentinel
version = 0.2.0
description = Semantic OpenAPI compatibility checks powered by TypeSafe JEV
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
author = jev-oas-sentinel contributors
keywords = openapi, compatibility, github-actions, jev, api
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Typing :: Typed

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
jev_oas_sentinel = py.typed

[options.entry_points]
console_scripts =
    jev-oas-sentinel = jev_oas_sentinel.cli:main
