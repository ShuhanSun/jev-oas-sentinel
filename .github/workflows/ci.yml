name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python benchmarks/run.py --check
      - run: uv run jev-oas-sentinel compare --base examples/base-openapi.yaml --head examples/head-openapi.yaml --no-jev --format sarif --output /tmp/report.sarif
      - name: Test composite action
        if: matrix.python-version == '3.13'
        uses: ./
        with:
          base: examples/base-openapi.yaml
          head: examples/head-openapi.yaml
          no-jev: "true"
          output: /tmp/action-report.sarif

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv build --no-sources
      - run: uvx --from twine==7.0.0 twine check dist/*
