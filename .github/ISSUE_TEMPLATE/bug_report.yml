name: Bug report
description: Report a reproducible problem in the CLI or GitHub Action
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove secrets and private API content before submitting.
  - type: input
    id: version
    attributes:
      label: Sentinel version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Python CLI
        - GitHub Action
        - SARIF or report rendering
        - OpenAPI loading or reference resolution
        - Jev transport or policy evaluation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized base/head specifications or a public repository and the exact command or workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output and exit code. Never include an API key.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, credentials, and private contract content.
          required: true
