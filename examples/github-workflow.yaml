name: OpenAPI compatibility

on:
  pull_request:
    paths:
      - "src/main/resources/openapi.yaml"

permissions:
  contents: read
  security-events: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Materialize baseline specification
        run: git show "${{ github.event.pull_request.base.sha }}:src/main/resources/openapi.yaml" > /tmp/openapi-base.yaml

      - name: Evaluate compatibility
        uses: your-org/jev-oas-sentinel@v0
        with:
          base: /tmp/openapi-base.yaml
          head: src/main/resources/openapi.yaml
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          mode: advisory
          format: sarif
          output: reports/jev-oas-sentinel.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/jev-oas-sentinel.sarif
